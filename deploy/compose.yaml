services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      PW_LISTEN_ADDR: 0.0.0.0:8080
      PW_DATA_DIR: /var/lib/partner-watch
      PW_PUBLIC_URL: ${PW_PUBLIC_URL:?PW_PUBLIC_URL must be set in deploy/.env}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - partner-watch-data:/var/lib/partner-watch
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  partner-watch-data:
